<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>PrimeFlix – Premium Streaming</title>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#e50914;--dark:#141414;--card-w:165px;--card-h:245px}
body{background-color:var(--dark);color:#fff;font-family:'Outfit',sans-serif;overflow-x:hidden;min-height:100vh;user-select:none}

/* Netflix Cinematic Intro Animation Screen */
.intro-screen{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;overflow:hidden}
#stage-container{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#000}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.cinematic-bar{position:absolute;left:0;width:100%;height:5.5vh;background:#000;z-index:40;pointer-events:none}
.cinematic-bar-top{top:0}
.cinematic-bar-bottom{bottom:0}
.vignette-overlay{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,0.75) 85%,#000 100%);z-index:30}

/* Navigation Bar */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 4%;height:70px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.4) 75%,transparent 100%);transition:background 0.3s}
nav.scrolled{background:rgba(20,20,20,0.96)!important;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06)}
.logo-container{display:flex;flex-direction:column;text-decoration:none}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;color:var(--red);letter-spacing:0.5px;line-height:0.95}
.logo span{color:#fff}

.search-container{position:relative;display:flex;align-items:center;margin-left:auto}
.search-input{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.18);padding:9px 14px 9px 40px;border-radius:24px;color:#fff;font-family:inherit;font-size:0.85rem;width:200px;max-width:40vw;transition:all 0.3s;outline:none;-webkit-user-select:text;user-select:text}
.search-input:focus{width:280px;max-width:55vw;border-color:var(--red);background:rgba(0,0,0,0.9)}
.search-icon{position:absolute;left:14px;width:15px;height:15px;fill:none;stroke:#aaa;stroke-width:2.5;pointer-events:none}

.search-overlay-view{position:fixed;inset:70px 0 0 0;background:#141414;z-index:950;padding:16px 4% 40px;overflow-y:auto;display:none}
.search-overlay-view.active{display:block}
.search-overlay-header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.search-back-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;width:40px;height:40px;min-width:40px;border-radius:50%;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.search-back-btn:hover,.search-back-btn:focus{background:var(--red);outline:none}
.search-overlay-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:0.5px;color:#ccc}
.search-status{min-height:24px;color:#999;font-size:0.9rem;margin:4px 2px 18px;display:flex;align-items:center;gap:10px}
.search-spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);border-top-color:var(--red);animation:searchSpin 0.7s linear infinite}
@keyframes searchSpin{to{transform:rotate(360deg)}}
.search-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(var(--card-w), 1fr));gap:16px;justify-content:center}
body.overlay-locked{overflow:hidden}

/* On-Screen Keyboard */
.osk-overlay{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center}
.osk-overlay.active{display:flex}
.osk-panel{background:#1a1a1a;border-top:1px solid #333;width:100%;max-width:800px;padding:12px 8px 20px;border-radius:16px 16px 0 0;animation:oskSlideUp 0.25s ease}
@keyframes oskSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.osk-display{width:100%;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:10px 14px;color:#fff;font-size:1.1rem;margin-bottom:10px;text-align:left;min-height:44px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.osk-row{display:flex;justify-content:center;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.osk-key{background:#2a2a2a;border:2px solid transparent;color:#fff;padding:10px 12px;border-radius:6px;font-size:1rem;font-family:inherit;min-width:32px;cursor:pointer;transition:all 0.15s;touch-action:manipulation;outline:none}
.osk-key:active{background:var(--red);transform:scale(0.92)}
.osk-key.wide{min-width:60px;font-size:0.85rem}
.osk-key.xwide{min-width:90px;font-size:0.8rem}
.osk-key.space{min-width:180px}
.osk-close{position:absolute;top:8px;right:12px;background:none;border:none;color:#999;font-size:1.2rem;cursor:pointer;outline:none}
.osk-header{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.osk-title{font-size:0.75rem;color:#888;text-transform:uppercase;letter-spacing:2px}

/* Hero Banner */
.hero{position:relative;height:85vh;display:flex;align-items:center;overflow:hidden;background-color:#000}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center top;opacity:0;transition:opacity 1s ease-in-out}
.hero-bg.active{opacity:1}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,#141414 0%,rgba(20,20,20,0.45) 60%,transparent 100%),linear-gradient(to top,#141414 0%,transparent 42%)}
.hero-content{position:relative;z-index:2;padding:0 4%;max-width:700px;margin-top:60px;transition:opacity 0.4s}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem, 7vw, 5.2rem);line-height:0.92;margin-bottom:14px}
.hero-desc{font-size:0.98rem;line-height:1.45;color:#ccc;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:300}
.hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn-play{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#000;border:none;padding:13px 30px;border-radius:6px;font-size:1.02rem;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:inherit}
.btn-play:hover{background:var(--red);color:#fff;transform:scale(1.03)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.16);color:#fff;border:1px solid rgba(255,255,255,0.22);padding:13px 22px;border-radius:6px;font-size:0.95rem;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);transition:all 0.2s;font-family:inherit}
.btn-secondary:hover{background:rgba(255,255,255,0.28)}

.rows-wrap{padding-bottom:120px;margin-top:-90px;position:relative;z-index:3;background:linear-gradient(to bottom, transparent, #141414 70px)}
.row-wrap{margin-bottom:32px}
.section-title{padding:0 4%;font-size:1.35rem;font-weight:700;color:#e5e5e5;margin-bottom:10px}
.row-scroller{display:flex;gap:10px;overflow-x:auto;padding:10px 4%;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
.row-scroller::-webkit-scrollbar{display:none}

.card{flex:0 0 var(--card-w);height:var(--card-h);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;transition:transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);background:#1a1a1a}
.card:hover{transform:scale(1.06);z-index:5;box-shadow:0 10px 25px rgba(0,0,0,0.7)}
.card img{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px}

/* Top 10 row */
.top10-scroller{padding-left:calc(4% + 75px);gap:0}
.top10-item{flex:0 0 auto;display:flex;align-items:flex-end;position:relative;height:var(--card-h);margin-right:30px}
.top10-rank{font-family:'Bebas Neue',sans-serif;font-size:13.5rem;line-height:1;color:transparent;-webkit-text-stroke:4px #808080;text-stroke:4px #808080;letter-spacing:-8px;position:relative;z-index:1;margin-right:-22px;user-select:none;pointer-events:none;align-self:flex-end;transform:translateY(10px)}
@supports not (-webkit-text-stroke: 1px #000){
  .top10-rank{color:#808080;-webkit-text-fill-color:unset}
}
.top10-item .card{z-index:2;flex:0 0 var(--card-w)}

/* Details Modal */
.details-modal{position:fixed;inset:0;z-index:2900;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:15px}
.details-modal.open{display:flex}
.details-container{width:100%;max-width:850px;background:#181818;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);box-shadow:0 20px 50px rgba(0,0,0,0.8);max-height:92vh;display:flex;flex-direction:column;position:relative}
.details-banner{position:relative;width:100%;height:320px;background-size:cover;background-position:center top}
.details-banner-overlay{position:absolute;inset:0;background:linear-gradient(to top,#181818 0%,rgba(24,24,24,0.3) 60%,transparent 100%)}
.details-close{position:absolute;top:15px;right:15px;z-index:10;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.details-close:hover{background:var(--red)}
.details-body{padding:20px 28px 28px;display:flex;gap:22px;margin-top:-60px;position:relative;z-index:2;overflow-y:auto}
.details-poster{width:145px;height:215px;border-radius:8px;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,0.7);flex-shrink:0;border:2px solid rgba(255,255,255,0.15)}
.details-info{flex:1;display:flex;flex-direction:column}
.details-title{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;line-height:1;margin-bottom:8px;letter-spacing:0.5px}
.details-tagline{font-style:italic;color:#aaa;font-size:0.9rem;margin-bottom:12px}
.details-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.details-tag{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);padding:3px 9px;border-radius:4px;font-size:0.75rem;font-weight:600}
.details-desc{font-size:0.92rem;line-height:1.5;color:#ccc;margin-bottom:22px}
.details-play-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:none;padding:12px 32px;border-radius:6px;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:inherit;width:fit-content}
.details-play-btn:hover{background:#ff1a25;transform:scale(1.03)}

/* TV Show Season/Episode Selector Modal */
.tv-selector{position:fixed;inset:0;z-index:3100;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.tv-selector.open{display:flex}
.tv-selector-inner{width:100%;max-width:520px;background:#1a1a1a;border-radius:14px;padding:24px;max-height:90vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.1)}
.tv-selector-label{font-size:0.82rem;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.tv-selector-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:16px;scrollbar-width:none}
.tv-selector-row::-webkit-scrollbar{display:none}
.tv-se-btn, .tv-ep-btn{flex:0 0 auto;background:#2a2a2a;border:1px solid #444;color:#fff;padding:9px 15px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:0.86rem;font-weight:600;transition:all 0.2s}
.tv-se-btn:hover, .tv-ep-btn:hover{background:#444}
.tv-se-btn.active, .tv-ep-btn.active{background:var(--red);border-color:var(--red)}
.tv-play-btn{width:100%;background:var(--red);color:#fff;border:none;padding:14px;border-radius:8px;font-size:1.08rem;font-weight:700;cursor:pointer;margin-top:8px;transition:all 0.2s;font-family:inherit}
.tv-play-btn:hover{background:#ff1a25}
.tv-selector-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.1);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tv-selector-close:hover{background:var(--red)}
.tv-info{text-align:center;margin-bottom:16px}
.tv-info h3{font-size:1.35rem;margin-bottom:4px}
.tv-info p{font-size:0.85rem;color:#aaa;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Fullscreen Player Modal with Multi-Server Switcher */
.modal-overlay{position:fixed;inset:0;background:#000;z-index:3000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{width:100vw;height:100vh;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
@media screen and (max-width:900px) and (orientation:portrait){
  .modal-overlay.open.force-landscape{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  .modal-overlay.open.force-landscape .modal{width:100%;height:100%}
}
.modal-close{position:absolute;top:14px;right:14px;z-index:3200;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.25);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:all 0.2s}
.modal-close:hover{background:var(--red);transform:scale(1.05)}
.player-container{width:100%;height:100%;position:relative;background:#000}
.player-container iframe{width:100%;height:100%;border:none;background:#000;position:absolute;top:0;left:0}
/* Click shield: absorbs the first (ghost pop-up) click on the player */
#clickShield{position:absolute;inset:0;z-index:99;background:transparent;cursor:pointer}

/* Top bar inside fullscreen player for switching working servers instantly */
.player-top-bar{position:absolute;top:14px;left:14px;right:64px;z-index:3150;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.player-top-bar::-webkit-scrollbar{display:none}
.quick-srv-btn{flex:0 0 auto;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.22);color:#ddd;padding:6px 12px;border-radius:6px;font-size:0.75rem;font-family:inherit;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);transition:all 0.15s}
.quick-srv-btn:hover{background:rgba(255,255,255,0.2);color:#fff}
.quick-srv-btn.active{background:var(--red);border-color:var(--red);color:#fff}

/* ===== Netflix-style responsive layer ===== */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,.card,.nav-tab,a{touch-action:manipulation}
nav{padding-top:env(safe-area-inset-top)}
.nav-tabs{display:flex;gap:6px;margin-left:28px;align-items:center}
.nav-tab{background:none;border:0;border-bottom:2px solid transparent;color:#cfcfcf;font:inherit;font-size:.92rem;padding:8px 10px;cursor:pointer;white-space:nowrap;border-radius:4px}
.nav-tab:hover{color:#fff}
.nav-tab.active{color:#fff;font-weight:700;border-bottom-color:var(--red)}
.rows-wrap.tab-home .row-wrap:not([data-tab="home"]),
.rows-wrap.tab-tv .row-wrap:not([data-tab="tv"]),
.rows-wrap.tab-movie .row-wrap:not([data-tab="movie"]),
.rows-wrap.tab-new .row-wrap:not([data-tab="new"]){display:none}
/* number scales with poster height (same look as before at 245px) */
.top10-rank{font-size:calc(var(--card-h)*.88);margin-right:calc(var(--card-h)*-.09);letter-spacing:calc(var(--card-h)*-.033);-webkit-text-stroke:calc(var(--card-h)*.016) #808080;transform:translateY(calc(var(--card-h)*.04))}
.top10-scroller{padding-left:calc(4% + var(--card-h)*.3)}
.top10-item{margin-right:calc(var(--card-h)*.12)}
.hero{height:85vh;height:85svh;min-height:380px}
:focus{outline:none}
.card:focus-visible,.nav-tab:focus-visible,.btn-play:focus-visible,.btn-secondary:focus-visible,.logo-container:focus-visible,button:focus-visible,.search-input:focus-visible{outline:3px solid #fff;outline-offset:3px;z-index:6}
.card:focus-visible{transform:scale(1.07);box-shadow:0 10px 30px rgba(0,0,0,.8)}
.nav-tab:focus-visible{background:rgba(255,255,255,.18)}

/* big screens / TV */
@media (min-width:1700px){:root{--card-w:200px;--card-h:298px}.section-title{font-size:1.6rem}.nav-tab{font-size:1.05rem}}
html.tv-mode{--card-w:230px;--card-h:342px;font-size:20px}
html.tv-mode nav{height:90px;padding-left:5%;padding-right:5%}
html.tv-mode .row-scroller,html.tv-mode .section-title{padding-left:5%}
html.tv-mode .top10-scroller{padding-left:calc(5% + var(--card-h)*.3)}
html.tv-mode .card:hover{transform:none;box-shadow:none}
html.tv-mode body{cursor:default}
/* tablet */
@media (max-width:1024px){:root{--card-w:140px;--card-h:208px}.nav-tabs{margin-left:14px}}
/* phone */
@media (max-width:700px){
  :root{--card-w:112px;--card-h:166px}
  nav{flex-wrap:wrap;height:auto;padding:calc(8px + env(safe-area-inset-top)) 4% 6px;row-gap:4px}
  .logo{font-size:1.9rem}
  .search-input{width:130px;max-width:42vw;padding:7px 10px 7px 34px;font-size:.8rem}
  .search-input:focus{width:200px;max-width:60vw}
  .nav-tabs{order:3;width:100%;margin-left:0;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .nav-tabs::-webkit-scrollbar{display:none}
  .nav-tab{border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:5px 13px;font-size:.8rem}
  .nav-tab.active{background:#fff;color:#000;border-color:#fff}
  .hero{height:66svh;height:66vh;height:66svh;min-height:340px;align-items:flex-end}
  .hero-content{margin-top:0;padding:0 5% 70px;max-width:100%}
  .hero-title{font-size:clamp(2.2rem,11vw,3.2rem)}
  .hero-desc{font-size:.85rem;-webkit-line-clamp:2;margin-bottom:14px}
  .btn-play,.btn-secondary{padding:10px 18px;font-size:.88rem}
  .rows-wrap{margin-top:-50px;padding-bottom:60px}
  .section-title{font-size:1.05rem;padding:0 5%}
  .row-wrap{margin-bottom:18px}
  .row-scroller{padding:8px 5%;gap:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .top10-scroller{padding-left:calc(5% + var(--card-h)*.3)}
  .details-banner{height:200px}
  .details-container{max-height:94dvh;max-height:94vh}
}
@media (max-width:700px) and (orientation:landscape){.hero{height:90svh}.hero-content{padding-bottom:30px}}
@media (hover:none){.card:hover{transform:none;box-shadow:none}.btn-play:hover{transform:none}}
/* lighter rendering on TV / phones / weak devices */
html.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lite .row-scroller{scroll-behavior:auto}
html.tv-mode .card,html.tv-mode .hero-bg{transition-duration:.15s}
</style>
</head>
<body oncontextmenu="return false">

<!-- Cinematic Netflix Style 'P' Intro Screen (Auto-play without click) -->
<div class="intro-screen" id="introScreen">
  <div id="stage-container">
    <div class="cinematic-bar cinematic-bar-top"></div>
    <div class="cinematic-bar cinematic-bar-bottom"></div>

    <canvas id="intro-canvas"></canvas>
    <div class="vignette-overlay"></div>
  </div>
</div>

<nav id="navbar">
  <a href="." class="logo-container">
    <span class="logo">PRIME<span>FLIX</span></span>
  </a>
  <div class="nav-tabs" id="navTabs" role="tablist">
    <button class="nav-tab active" data-tab="home">Home</button>
    <button class="nav-tab" data-tab="tv">TV Shows</button>
    <button class="nav-tab" data-tab="movie">Movies</button>
    <button class="nav-tab" data-tab="new">New &amp; Popular</button>
  </div>
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" class="search-input" id="globalSearch" placeholder="Search movies & shows..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="search" enterkeyhint="search">
  </div>
</nav>

<!-- On-Screen Keyboard -->
<div class="osk-overlay" id="oskOverlay">
  <div class="osk-panel">
    <div class="osk-header">
      <span class="osk-title">Search</span>
      <button class="osk-close" id="oskCloseBtn" onclick="closeOSK()">✕</button>
    </div>
    <div class="osk-display" id="oskDisplay"></div>

async function resolveTmdbIdFromImdb(imdbId) {
  if (!imdbId) return null;
  if (tmdbResolveCache[imdbId] !== undefined) return tmdbResolveCache[imdbId];
  try {
    const url = `https://api.themoviedb.org/3/find/${imdbId}?api_key=${API_KEY}&external_source=imdb_id`;
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    const hit = (data.movie_results && data.movie_results[0]) || (data.tv_results && data.tv_results[0]) || null;
    const resolved = hit ? hit.id : null;
    tmdbResolveCache[imdbId] = resolved;
    return resolved;
  } catch (e) {
    tmdbResolveCache[imdbId] = null;
    return null;
  }
}

async function resolveImdbIdFromTmdb(tmdbId, mediaType = 'movie') {
  if (!tmdbId || tmdbId.toString().startsWith('tt')) return tmdbId;
  const cacheKey = `${mediaType}_${tmdbId}`;
  if (imdbResolveCache[cacheKey] !== undefined) return imdbResolveCache[cacheKey];
  try {
    const typePath = mediaType === 'tv' ? 'tv' : 'movie';
    const url = `https://api.themoviedb.org/3/${typePath}/${tmdbId}/external_ids?api_key=${API_KEY}`;
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    const resolved = (data && data.imdb_id) ? data.imdb_id : null;
    imdbResolveCache[cacheKey] = resolved;
    return resolved;
  } catch (e) {
    imdbResolveCache[cacheKey] = null;
    return null;
  }
}

async function queryTMDB(path, attempt = 0, silent = false) {
  const url = `https://api.themoviedb.org/3${path}${path.includes('?') ? '&' : '?'}api_key=${API_KEY}`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    if (attempt < 2) {
      await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
      return queryTMDB(path, attempt + 1, silent);
    }
    if (!silent) showTMDBError(err.message || 'network error');
    return { failed: true, results: [] };
  }
}

const omdbCache = {};
async function omdbFetchByTitle(title, type = 'movie', attempt = 0) {
  const isTv = type === 'tv';
  const cacheKey = isTv ? 'tv_' + title : title;
  if (omdbCache[cacheKey]) return omdbCache[cacheKey];
  const url = `https://www.omdbapi.com/?apikey=${OMDB_KEY}&t=${encodeURIComponent(title)}&type=${isTv ? 'series' : 'movie'}`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    if (data.Response === 'False') return null;
    const normalized = {
      id: data.imdbID,
      title: data.Title,
      overview: data.Plot,
      poster_path: null,
      omdb_poster: (data.Poster && data.Poster !== 'N/A') ? data.Poster : null,
      backdrop_path: null,
      omdb_backdrop: (data.Poster && data.Poster !== 'N/A') ? data.Poster : null,
      imdbID: data.imdbID,
      omdb_genre: (data.Genre && data.Genre !== 'N/A') ? data.Genre : '',
      media_type: type
    };
    if (isTv) normalized.totalSeasons = data.totalSeasons || '1';
    omdbCache[cacheKey] = normalized;
    return normalized;
  } catch (err) {
    if (attempt < 2) {
      await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
      return omdbFetchByTitle(title, type, attempt + 1);
    }
    return null;
  }
}

async function omdbFetchTitles(titles, type = 'movie') {
  const results = await Promise.all(titles.map(t => omdbFetchByTitle(t, type)));
  return { results: results.filter(Boolean) };
}

async function queryMovies(row) {
  const tmdbResult = await queryTMDB(row.dataset.endpoint, 0, true);
  if (!tmdbResult.failed && (tmdbResult.results || []).length) {
    (tmdbResult.results || []).forEach(m => { if (!m.media_type) m.media_type = row.dataset.mediaType || 'movie'; });
    return tmdbResult;
  }
  let fallback = { results: [] };
  if (row.dataset.omdbMode === 'trending') fallback = await omdbFetchTitles(OMDB_TRENDING_TITLES, 'movie');
  else if (row.dataset.omdbMode === 'trending_tv') fallback = await omdbFetchTitles(OMDB_TV_TRENDING, 'tv');
  else if (row.dataset.omdbMode === 'genre') fallback = await omdbFetchTitles(OMDB_GENRE_TITLES[row.dataset.genreName] || [], 'movie');
  else if (row.dataset.omdbMode === 'genre_tv') fallback = await omdbFetchTitles(OMDB_TV_TITLES[row.dataset.genreName] || [], 'tv');
  else if (row.dataset.omdbMode === 'anime_tv') fallback = await omdbFetchTitles(OMDB_ANIME_TV_TITLES, 'tv');
  else if (row.dataset.omdbMode === 'anime_movie') fallback = await omdbFetchTitles(OMDB_ANIME_MOVIE_TITLES, 'movie');
  return fallback;
}

function posterUrl(movie, size) {

  if (movie.poster_path) return `https://image.tmdb.org/t/p/${size}${movie.poster_path}`;
  return '';
}
function backdropUrl(movie) {
  if (movie.omdb_backdrop) return movie.omdb_backdrop;
  if (movie.backdrop_path) return `https://image.tmdb.org/t/p/original${movie.backdrop_path}`;
  return '';
}

    const data = await res.json();
    if (data.Response === 'False' || !Array.isArray(data.Episodes)) return 20;
    return data.Episodes.length || 20;
  } catch (e) {
    return 20;
  }
}

async function loadRowUnique(row, need = 18) {
  const ds = row.dataset, top10 = row.classList.contains('top10-row');
  const out = [];
  const add = (m, key) => { if (!top10 && SEEN.has(key)) return false; SEEN.add(key); out.push(m); return true; };
  const start = parseInt(ds.page) || 1;

  for (let p = start; p < start + maxPages && out.length < need; p++) {
    const url = ds.endpoint + (ds.endpoint.includes('?') ? '&' : '?') + 'page=' + p;
    const r = await queryTMDB(url, 0, true);
    if (r.failed) break;
    (r.results || []).forEach(m => {
      if (out.length >= need || !m.poster_path) return;
      if (!m.media_type || m.media_type === 'person') m.media_type = ds.mediaType || 'movie';
      add(m, m.media_type + ':' + m.id);
    });
  }
  if (!out.length) {
    const fb = await queryMovies({ dataset: ds });
    (fb.results || []).forEach(m => { if (out.length < need) add(m, 'omdb:' + (m.imdbID || m.title)); });
  }
  return out;
}

function makeRow({ endpoint, omdbMode = 'none', mediaType, title, extraClass = '', minHeight = null, tab = 'home', page = 1 }) {
  const row = document.createElement('div');
  row.className = 'row-wrap' + (extraClass ? ' ' + extraClass : '');
  row.dataset.endpoint = endpoint;
  row.dataset.omdbMode = omdbMode;
  row.dataset.mediaType = mediaType;
  row.dataset.tab = tab;
  row.dataset.page = page;
  const styleAttr = minHeight ? ` style="min-height:${minHeight}px;"` : '';
  row.innerHTML = `<h2 class="section-title">${title}</h2><div class="row-scroller"${styleAttr}>Loading...</div>`;
  return row;
}

function buildCard(movie, rank = null, focusable = false) {
  const poster = posterUrl(movie, 'w300');
  if (!poster) return null;
  const soon = movie.release_date && movie.release_date > new Date().toISOString().slice(0, 10);
  const badge = soon ? '<span class="card-badge" style="background:#f5a623;color:#000;">COMING SOON</span>' : (movie.media_type === 'tv' ? '<span class="card-badge">SERIES</span>' : '<span class="card-badge" style="background:#333;">HD</span>');

  if (rank !== null) {
    const item = document.createElement('div');
    item.className = 'top10-item';
    item.dataset.rank = rank;
    item.innerHTML = `
      <span class="top10-rank">${rank}</span>
      <div class="card">
        ${badge}
        <img src="${poster}" loading="lazy">
      </div>`;
    item.querySelector('.card').onclick = () => openDetailsModal(movie);
    return item;
  }

  const card = document.createElement('div');
  card.className = 'card';
  if (focusable) { card.tabIndex = 0; card.setAttribute('role', 'button'); }
  card.innerHTML = `${badge}<img src="${poster}" ${focusable ? '' : 'loading="lazy"'}>`;
  card.onclick = () => openDetailsModal(movie);
  if (focusable) {
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); card.onclick(); }
    });
  }
  return card;
}

async function renderDetailTags(movie) {
  let names = [];
  if (Array.isArray(movie.genre_ids) && movie.genre_ids.length) {
    names = movie.genre_ids.map(id => ALL_GENRES[id]).filter(Boolean);
  } else if (movie.omdb_genre) {
    names = movie.omdb_genre.split(',');
  }
  setDetailTags(names);
  if (names.length) return;
  // No genre info on the object: fetch it from TMDB
  document.getElementById('detTags').innerHTML = '';
  const isTv = movie.media_type === 'tv';
  if (movie.id && typeof movie.id === 'number') {
    const d = await queryTMDB(`/${isTv ? 'tv' : 'movie'}/${movie.id}`, 0, true);
    if (d && d.genres && currentMovieObject === movie) {
      setDetailTags(d.genres.map(g => ALL_GENRES[g.id] || g.name));
    }
  }
}

function buildSelectorButtons(rowEl, className, count, activeIndex, label, onSelect) {
  rowEl.innerHTML = '';
  for (let i = 1; i <= count; i++) {

    btn.className = className + (i === activeIndex ? ' active' : '');
    btn.textContent = label(i);

  document.getElementById('tvSelDesc').textContent = isTv ? (movie.overview || 'Choose season and episode') : 'Ready to stream';

  document.getElementById('tvEpisodeRow').innerHTML = '';

  currentSeasonEpisodeCounts = {};
  currentTvSourceIsTmdb = false;
  currentTvImdbId = activeImdbId;
  currentTvTitle = movie.title || movie.name || '';

  let seasonCount = 1;
  if (activeTmdbId) {
    try {
      const detail = await queryTMDB(`/tv/${activeTmdbId}`, 0, true);
      if (detail && detail.seasons) {
        const realSeasons = detail.seasons.filter(s => s.season_number > 0);
        realSeasons.forEach(s => { currentSeasonEpisodeCounts[s.season_number] = s.episode_count || 0; });
        seasonCount = realSeasons.length || 1;
        currentTvSourceIsTmdb = true;
      }
    } catch (e) {}
  } else if (movie.totalSeasons) {
    seasonCount = parseInt(movie.totalSeasons) || 1;
  }

  buildSelectorButtons(
    document.getElementById('tvSeasonRow'),
    'tv-se-btn',
    Math.min(seasonCount, 30),
    1,
    (s) => 'S' + s,
    async (s) => { selectedSeason = s; await loadEpisodesForSeason(s); }
  );

  await loadEpisodesForSeason(1);
}

async function loadEpisodesForSeason(seasonNum) {
  let count = currentSeasonEpisodeCounts[seasonNum];
  if (count === undefined) {
    const epRow = document.getElementById('tvEpisodeRow');
    epRow.innerHTML = '<span style="opacity:.6;font-size:.85rem;">Loading episodes…</span>';
    if (currentTvSourceIsTmdb) {
      count = 20;
    } else {
      count = await fetchOmdbSeasonEpisodeCount(currentTvImdbId, currentTvTitle, seasonNum);
    }
    currentSeasonEpisodeCounts[seasonNum] = count;
  }
  buildEpisodeButtons(count || 1);
}

async function initializePremiumPlay(movie) {
  let tmdbId = null;
  let imdbId = null;
  activeMediaType = (movie && movie.media_type) ? movie.media_type : 'movie';

  if (typeof movie === 'object' && movie !== null) {
    if (movie.id && !isNaN(parseInt(movie.id)) && !movie.id.toString().startsWith('tt')) {
      tmdbId = movie.id.toString();
    }
    if (movie.tmdb_id && !tmdbId) {
      tmdbId = movie.tmdb_id.toString();
    }
    if (movie.imdbID && movie.imdbID.toString().startsWith('tt')) {
      imdbId = movie.imdbID.toString();
    } else if (movie.id && movie.id.toString().startsWith('tt')) {
      imdbId = movie.id.toString();
    }

    if (imdbId && !tmdbId) {
      const resolvedTmdb = await resolveTmdbIdFromImdb(imdbId);
      if (resolvedTmdb) tmdbId = resolvedTmdb.toString();
    } else if (tmdbId && !imdbId) {
      const resolvedImdb = await resolveImdbIdFromTmdb(tmdbId, activeMediaType);
      if (resolvedImdb) imdbId = resolvedImdb.toString();
    }
  } else if (movie) {
    const str = movie.toString();
    if (str.startsWith('tt')) imdbId = str;
    else tmdbId = str;
  }

  activeTmdbId = tmdbId;
  activeImdbId = imdbId;
  selectedSeason = 1;
  selectedEpisode = 1;

  if (activeMediaType === 'movie') {
    playSelectedEpisode();
  } else {
    await openTvSelector(movie);
  }
}

let playerIsOpen = false;
function forcePersistentFullscreen() {
  const overlayEl = document.getElementById('modalOverlay');
  const req = overlayEl.requestFullscreen || overlayEl.webkitRequestFullscreen || overlayEl.mozRequestFullScreen || overlayEl.msRequestFullscreen;
  if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
    req.call(overlayEl).catch(() => {});
  }
  if (window.matchMedia('(max-width:900px)').matches) {
    overlayEl.classList.add('force-landscape');
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  }
}

function exitLandscapeMode() {
  const overlayEl = document.getElementById('modalOverlay');
  overlayEl.classList.remove('force-landscape');
  if (screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) {} }
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch(() => {});
  }
}

function closePremiumTheatre() {
  playerIsOpen = false;
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('premiumPlayer').src = '';
  exitLandscapeMode();
}

['fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
  document.addEventListener(evt, () => {
    const inFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!inFullscreen && playerIsOpen) {
      setTimeout(() => {
        if (playerIsOpen) forcePersistentFullscreen();
      }, 120);
    }
  });
});

}

function closeSearchOverlay() {
  document.getElementById('oskOverlay').classList.remove('active');
  document.getElementById('searchOverlay').classList.remove('active');
  lockBodyScroll(false);
}

function oskType(char) {
  oskText += (oskShiftState ? char.toUpperCase() : char.toLowerCase());

}
function oskShift() { oskShiftState = !oskShiftState; }
function oskBackspace() { oskText = oskText.slice(0, -1); updateOskDisplay(); triggerSearch(); }
function oskClear() { oskText = ''; updateOskDisplay(); triggerSearch(); }
function oskSearch() { closeOSK(); }

let searchTimeout = null;
function triggerSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => performSearch(oskText), 400);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

async function performSearch(v) {
  const overlay = document.getElementById('searchOverlay');
  const grid = document.getElementById('searchGrid');
  const status = document.getElementById('searchStatus');
  if (v.trim().length < 2) { grid.innerHTML = ''; status.innerHTML = ''; return; }
  overlay.classList.add('active');
  lockBodyScroll(true);
  status.innerHTML = `<span class="search-spinner"></span> Searching for "${escapeHtml(v)}"...`;

  let movieRes = await queryTMDB(`/search/movie?query=${encodeURIComponent(v)}`, 0, true);
  let tvRes = await queryTMDB(`/search/tv?query=${encodeURIComponent(v)}`, 0, true);
  (movieRes.results || []).forEach(m => m.media_type = 'movie');
  (tvRes.results || []).forEach(m => { m.media_type = 'tv'; m.title = m.name || m.title; });
  let allResults = [...(movieRes.results || []), ...(tvRes.results || [])];

  grid.innerHTML = '';
  let shown = 0;
  allResults.forEach(m => {
    const card = buildCard(m, null, true);
    if (!card) return;
    shown++;
    card.onclick = () => { closeSearchOverlay(); openDetailsModal(m); };
    grid.appendChild(card);
  });
  status.textContent = shown ? `${shown} results found` : `No results found.`;
}

// ========================================================
// INTRO ANIMATION & SOUND SCRIPT (NETFLIX STYLE 'P')
// ========================================================
class NetflixSoundSynthesizer {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContextClass();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  play() {
    this.init();
    const ctx = this.ctx;
    const now = ctx.currentTime;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-16, now);
    comp.knee.setValueAtTime(10, now);
    comp.ratio.setValueAtTime(8, now);
    comp.attack.setValueAtTime(0.002, now);
    comp.release.setValueAtTime(0.2, now);
    comp.connect(ctx.destination);

    const master = ctx.createGain();
    master.gain.setValueAtTime(1.0, now);
    master.connect(comp);

    // Beat 1: Ta-
    const t1 = now + 0.05;
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(145, t1);
    osc1.frequency.exponentialRampToValueAtTime(42, t1 + 0.12);
    gain1.gain.setValueAtTime(0.85, t1);
    gain1.gain.exponentialRampToValueAtTime(0.001, t1 + 0.18);
    osc1.connect(gain1);
    gain1.connect(master);
    osc1.start(t1);
    osc1.stop(t1 + 0.2);

    const bLen = Math.floor(ctx.sampleRate * 0.04);
    const noiseBuf = ctx.createBuffer(1, bLen, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bLen; i++) data[i] = Math.random() * 2 - 1;
    const noiseNode = ctx.createBufferSource();
    noiseNode.buffer = noiseBuf;

    const noiseFilt = ctx.createBiquadFilter();
    noiseFilt.type = 'bandpass';
    noiseFilt.frequency.setValueAtTime(950, t1);
    noiseFilt.Q.setValueAtTime(2.8, t1);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.35, t1);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t1 + 0.05);

    noiseNode.connect(noiseFilt);
    noiseFilt.connect(noiseGain);
    noiseGain.connect(master);
    noiseNode.start(t1);

    // Beat 2: -Dum
    const t2 = now + 0.22;
    const sub = ctx.createOscillator();
    const subGain = ctx.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(88, t2);
    sub.frequency.exponentialRampToValueAtTime(30, t2 + 0.7);
    subGain.gain.setValueAtTime(1.0, t2);
    subGain.gain.exponentialRampToValueAtTime(0.0001, t2 + 3.2);
    sub.connect(subGain);
    subGain.connect(master);
    sub.start(t2);
    sub.stop(t2 + 3.3);

    const chordPitches = [36.7, 55.0, 73.4, 87.3, 110.0, 146.8];
    const pans = [-0.6, 0.6, -0.3, 0.3, -0.1, 0.1];

    chordPitches.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filt = ctx.createBiquadFilter();

      osc.type = (idx % 2 === 0) ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(freq, t2);
      osc.detune.setValueAtTime((Math.random() - 0.5) * 12, t2);

      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(260, t2);
      filt.frequency.exponentialRampToValueAtTime(750, t2 + 0.4);
      filt.frequency.exponentialRampToValueAtTime(110, t2 + 3.4);
      filt.Q.setValueAtTime(1.8, t2);

      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (pan) pan.pan.setValueAtTime(pans[idx] || 0, t2);

      gain.gain.setValueAtTime(0.001, t2);
      gain.gain.linearRampToValueAtTime(0.3 / (idx * 0.4 + 1), t2 + 0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001, t2 + 3.5);

      osc.connect(filt);
      filt.connect(gain);
      if (pan) {
        gain.connect(pan);
        pan.connect(master);
      } else {
        gain.connect(master);
      }
      osc.start(t2);
      osc.stop(t2 + 3.6);
    });
  }
}

const soundEngine = new NetflixSoundSynthesizer();
const introCanvas = document.getElementById('intro-canvas');
const introCtx = introCanvas.getContext('2d');

let introWidth = 0;
let introHeight = 0;
let introDpr = 1;

const pCanvas = document.createElement('canvas'), lCanvas = document.createElement('canvas');
const pCtx = pCanvas.getContext('2d'), lCtx = lCanvas.getContext('2d');
let introNow = 0;
function resizeIntroCanvas() {
  introDpr = Math.min(window.devicePixelRatio || 1, IS_TV ? 1 : 2);
  introWidth = window.innerWidth;
  introHeight = window.innerHeight;
  [[introCanvas, introCtx], [pCanvas, pCtx], [lCanvas, lCtx]].forEach(([c, x]) => {
    c.width = introWidth * introDpr;
    c.height = introHeight * introDpr;
    x.setTransform(introDpr, 0, 0, introDpr, 0, 0);
  });
}
window.addEventListener('resize', resizeIntroCanvas);
resizeIntroCanvas();

const SPECTRUM_COLORS = [
  '#e50914', '#b20710', '#ff1e27', '#ff3344',
  '#00f2fe', '#4facfe', '#00c6ff', '#0072ff',
  '#ff8a00', '#ffa726', '#ffd54f', '#ffffff',
  '#7f00ff', '#e100ff', '#ff007f', '#a855f7'
];

class SpectrumStreak {
  constructor(idx, total) {
    this.reset(idx, total);
  }
  reset(idx, total) {
    const u = idx / total;
    this.originX = (u - 0.5) * (introWidth * 0.45);
    this.speed = Math.random() * 2.5 + 1.2;
    this.width = (Math.random() * 6 + 1.5);
    this.color = SPECTRUM_COLORS[Math.floor(Math.random() * SPECTRUM_COLORS.length)];
    this.alpha = Math.random() * 0.7 + 0.3;
    this.drift = (Math.random() - 0.5) * 120;
  }
  draw(progress, burstPower, ctx = introCtx) {
    const expScale = Math.pow(burstPower, 2.5) * (this.speed * 2.2);
    const renderX = (introWidth / 2) + (this.originX + this.drift * progress) * (1 + expScale * 0.35) + Math.sin(introNow * this.speed * 2 + this.originX) * 5;
    const renderW = this.width * (1 + expScale * 0.18);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = Math.min(1, this.alpha * (1 - Math.pow(progress, 2.2)));

    const grad = ctx.createLinearGradient(renderX, 0, renderX, introHeight);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.2, this.color);
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(0.8, this.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = grad;
    ctx.fillRect(renderX - renderW / 2, 0, renderW, introHeight);

    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = Math.min(1, ctx.globalAlpha * 1.3);
    ctx.fillRect(renderX - 0.75, 0, 1.5, introHeight);
    ctx.restore();
  }
}

const BEAM_TOTAL = IS_LITE ? 110 : 200;
const streaks = [];
for (let i = 0; i < BEAM_TOTAL; i++) {
  streaks.push(new SpectrumStreak(i, BEAM_TOTAL));
}

function drawLetterP(progress, zoom, glow, ctx = introCtx) {
  ctx.save();
  const cx = introWidth / 2;
  const cy = introHeight / 2;
  const unit = Math.min(introWidth, introHeight) * 0.38;
  const stemW = unit * 0.22;
  const pivotX = -unit * 0.31;
  ctx.translate(cx + pivotX, cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-pivotX, 0);
  const totalH = unit * 1.6;
  const stemX = -unit * 0.42;
  const topY = -totalH / 2;

  const loopOuterRadius = unit * 0.48;
  const loopCenterY = topY + loopOuterRadius;
  const loopCenterX = stemX + stemW * 0.8;

  ctx.shadowColor = 'rgba(229, 9, 20, 0.65)';
  ctx.shadowBlur = 45 * glow;

  const loopProgress = Math.min(1, progress / 0.55);
  if (loopProgress > 0) {
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = -6;
    ctx.shadowOffsetY = 6;

    ctx.lineWidth = stemW;
    ctx.lineCap = 'butt';

    const loopGrad = ctx.createLinearGradient(
      loopCenterX, loopCenterY - loopOuterRadius,
      loopCenterX + loopOuterRadius, loopCenterY + loopOuterRadius
    );
    loopGrad.addColorStop(0, '#ff3b42');
    loopGrad.addColorStop(0.35, '#e50914');
    loopGrad.addColorStop(0.75, '#990006');
    loopGrad.addColorStop(1, '#330003');
    ctx.strokeStyle = loopGrad;

    const startAngle = Math.PI * 0.5;
    const totalAngle = Math.PI * 1.1;
    const currentAngle = startAngle - (totalAngle * loopProgress);

    ctx.beginPath();
    ctx.arc(loopCenterX, loopCenterY, loopOuterRadius - (stemW * 0.45), startAngle, currentAngle, true);
    ctx.stroke();
    ctx.restore();
  }

  if (progress > 0.48) {
    const stemProgress = Math.min(1, (progress - 0.48) / 0.52);
    const currentStemH = totalH * stemProgress;

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetX = -4;
    ctx.shadowOffsetY = 8;

    const stemGrad = ctx.createLinearGradient(stemX, topY, stemX, topY + totalH);
    stemGrad.addColorStop(0, '#ff242b');
    stemGrad.addColorStop(0.3, '#e50914');
    stemGrad.addColorStop(0.75, '#8c0005');
    stemGrad.addColorStop(1, '#240002');
    ctx.fillStyle = stemGrad;

    ctx.fillRect(stemX, topY, stemW, currentStemH);
    ctx.restore();
  }
  ctx.restore();
}

let animStartTime = null;
let isRunning = false;
let animFrameId = null;
const introScreen = document.getElementById('introScreen');

function animateSequence(timestamp) {
  if (!animStartTime) animStartTime = timestamp;
  const t = (timestamp - animStartTime) / 1000;
  introNow = t;

  introCtx.fillStyle = '#000';
  introCtx.fillRect(0, 0, introWidth, introHeight);

  // P zooms in (camera goes inside the letter), like Netflix
  const unit = Math.min(introWidth, introHeight) * 0.38;
  const zmax = Math.max(30, (introWidth / (unit * 0.22)) * 1.6);
  const ZS = 1.4, ZD = 1.9;
  let z = 1 + Math.min(t, ZS) * 0.04;
  if (t > ZS) {
    const e = Math.min((t - ZS) / ZD, 1);
    z = 1.06 * Math.exp(Math.log(zmax / 1.06) * e * e);
  }
  const appear = Math.min(t / 1.1, 1);
  const ease = 1 - Math.pow(1 - appear, 2.5);
  const glow = Math.min(1, t / 0.7);

  // red P gradually turns into colour light
  const pAlpha = 1 - 0.88 * Math.min(Math.max((t - 1.5) / 1.4, 0), 1);
  introCtx.save();
  introCtx.globalAlpha = pAlpha;
  drawLetterP(ease, z, glow);
  introCtx.restore();

  // coloured light plays INSIDE the P shape (masked), same zoom
  const lt = t - 0.9;
  if (lt > 0) {
    const lp = Math.min(lt / 3.4, 1);
    const burst = Math.max(0, t - 2.4) * 0.85;
    pCtx.clearRect(0, 0, introWidth, introHeight);
    drawLetterP(ease, z, 0, pCtx);
    lCtx.globalCompositeOperation = 'source-over';
    lCtx.clearRect(0, 0, introWidth, introHeight);
    streaks.forEach(st => st.draw(lp, burst, lCtx));
    lCtx.globalCompositeOperation = 'destination-in';
    lCtx.drawImage(pCanvas, 0, 0, introWidth, introHeight);
    lCtx.globalCompositeOperation = 'source-over';
    introCtx.save();
    introCtx.globalAlpha = Math.min(1, lt / 0.6);
    introCtx.globalCompositeOperation = 'screen';
    introCtx.drawImage(lCanvas, 0, 0, introWidth, introHeight);
    introCtx.restore();
  }

  // soft flare when the camera passes through
  const ft = t - 2.6;
  if (ft > 0) {
    const fp = Math.min(ft / 1.6, 1);
    const fa = Math.sin(fp * Math.PI) * 0.6;
    if (fa > 0.01) {
      introCtx.save();
      introCtx.globalCompositeOperation = 'screen';
      const cx = introWidth / 2, cy = introHeight / 2;
      const rad = Math.max(introWidth, introHeight) * (0.35 + fp * 0.6);
      const g = introCtx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, `rgba(255,255,255,${fa})`);
      g.addColorStop(0.15, `rgba(255,75,75,${fa * 0.8})`);
      g.addColorStop(0.45, `rgba(229,9,20,${fa * 0.45})`);
      g.addColorStop(0.8, `rgba(125,0,190,${fa * 0.2})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      introCtx.fillStyle = g;
      introCtx.fillRect(0, 0, introWidth, introHeight);
      introCtx.restore();
    }
  }

  if (t >= 4.3) {
    introCtx.fillStyle = `rgba(0,0,0,${Math.min((t - 4.3) / 0.7, 1)})`;
    introCtx.fillRect(0, 0, introWidth, introHeight);
  }

  if (t < 5.0) {
    animFrameId = requestAnimationFrame(animateSequence);
  } else {
    finishIntro();
  }
}

function startIntro() {
  if (isRunning) return;
  isRunning = true;
  for (let i = 0; i < BEAM_TOTAL; i++) {
    streaks[i].reset(i, BEAM_TOTAL);
  }
  soundEngine.play();
  animStartTime = null;
  if (animFrameId) cancelAnimationFrame(animFrameId);
  animFrameId = requestAnimationFrame(animateSequence);
}

function finishIntro() {
  isRunning = false;
  introScreen.style.display = 'none';
  document.body.style.overflow = 'auto';
  if (IS_TV) setTimeout(() => { const b = document.getElementById('heroPlayBtn'); if (b) b.focus({ preventScroll: true }); }, 150);
}

// Auto-play intro immediately on window load and request full screen
window.addEventListener('load', () => {
  document.body.style.overflow = 'hidden';
  // Request full screen automatically
  const docEl = document.documentElement;
  if (docEl.requestFullscreen) {
    docEl.requestFullscreen().catch(() => {});
  } else if (docEl.webkitRequestFullscreen) {
    docEl.webkitRequestFullscreen().catch(() => {});
  }
  startIntro();

  // Browsers block fullscreen without a user gesture, so retry on the first tap/click/key
  const tryFS = () => {
    const d = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { removeFS(); return; }
    const r = d.requestFullscreen || d.webkitRequestFullscreen;
    if (r) { try { const p = r.call(d); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    removeFS();
  };
  const evts = ['click', 'touchend', 'keydown', 'pointerdown'];
  const removeFS = () => evts.forEach(e => document.removeEventListener(e, tryFS, true));
  evts.forEach(e => document.addEventListener(e, tryFS, true));
});

// ===== TV remote / arrow-key spatial navigation + OK + Back =====
(function () {
  const SEL = '.nav-tab,.logo-container,#globalSearch,.btn-play,.btn-secondary,.card,button,[tabindex="0"],a[href]';
  const DIR = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', 37: 'l', 39: 'r', 38: 'u', 40: 'd' };
  const OVERLAYS = ['#modalOverlay.open', '#oskOverlay.open', '#tvSelector.open', '#detailsModal.open', '#searchOverlay.open'];
  const root = () => { for (const q of OVERLAYS) { const e = document.querySelector(q); if (e) return e; } return document; };
  const vis = el => { const r = el.getBoundingClientRect(); return r.width > 4 && r.height > 4 && !el.disabled && getComputedStyle(el).visibility !== 'hidden' && el.offsetParent !== null; };
  function move(d) {
    const list = Array.from(root().querySelectorAll(SEL)).filter(vis);
    if (!list.length) return;
    let cur = document.activeElement;
    if (!list.includes(cur)) { list[0].focus({ preventScroll: true }); return; }
    const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let best = null, bs = 1e12;
    list.forEach(el => {
      if (el === cur) return;
      const r = el.getBoundingClientRect(), dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
      let p, q;
      if (d === 'r' && dx > 4) { p = dx; q = Math.abs(dy); }
      else if (d === 'l' && dx < -4) { p = -dx; q = Math.abs(dy); }
      else if (d === 'd' && dy > 4) { p = dy; q = Math.abs(dx); }
      else if (d === 'u' && dy < -4) { p = -dy; q = Math.abs(dx); }
      else return;
      const sc = p + q * 2.5;
      if (sc < bs) { bs = sc; best = el; }
    });
    if (!best) return;
    best.focus({ preventScroll: true });
    if (!best.closest('nav')) best.scrollIntoView({ block: 'center', inline: 'center', behavior: 'auto' });
    else window.scrollTo(0, 0);
  }
  function goBack() {
    const t = (q, fn) => { const e = document.querySelector(q); if (e) { fn(); return true; } return false; };
    if (t('#modalOverlay.open', () => closePremiumTheatre())) return true;
    if (t('#oskOverlay.open', () => closeOSK())) return true;
    if (t('#tvSelector.open', () => closeTvSelector())) return true;
    if (t('#detailsModal.open', () => closeDetailsModal())) return true;
    if (t('#searchOverlay.open', () => closeSearchOverlay())) return true;
    return false;
  }
  document.addEventListener('keydown', e => {
    const k = DIR[e.key] || DIR[e.keyCode];
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if (k) {
      if (typing && (k === 'l' || k === 'r')) return;
      if (document.querySelector('#modalOverlay.open')) return;
      e.preventDefault(); move(k); return;
    }
    if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 29443 || e.keyCode === 23) {
      const el = document.activeElement;
      if (el && !typing && el.tagName !== 'BUTTON' && el.tagName !== 'A') { e.preventDefault(); el.click(); }
    } else if (e.key === 'Escape' || e.keyCode === 27 || e.keyCode === 10009 || e.keyCode === 461 || (e.key === 'Backspace' && !typing)) {
      if (goBack()) e.preventDefault();
    }
  });
})();
